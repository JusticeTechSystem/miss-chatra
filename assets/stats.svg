<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="Miss Chatra by the numbers">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2418"/><stop offset="1" stop-color="#06140f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e676"/><stop offset="1" stop-color="#00bcd4"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e676"/><stop offset="1" stop-color="#7dffd8"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c0"><rect x="31" y="14" width="212" height="132" rx="18"/></clipPath><clipPath id="c1"><rect x="273" y="14" width="212" height="132" rx="18"/></clipPath><clipPath id="c2"><rect x="515" y="14" width="212" height="132" rx="18"/></clipPath><clipPath id="c3"><rect x="757" y="14" width="212" height="132" rx="18"/></clipPath>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.00s" dur=".6s" fill="freeze"/>
    <rect x="31" y="14" width="212" height="132" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="3.6s" begin="0.60s" repeatCount="indefinite"/>
    </rect>
    <rect x="-59" y="14" width="90" height="132" fill="url(#shine)" clip-path="url(#c0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;302 0" dur="4.5s" begin="1.00s" repeatCount="indefinite"/>
    </rect>
    <text x="137.0" y="86" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#num)">680+</text>
    <text x="137.0" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#bff5d8">Built-in commands</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.15s" dur=".6s" fill="freeze"/>
    <rect x="273" y="14" width="212" height="132" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="3.6s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="183" y="14" width="90" height="132" fill="url(#shine)" clip-path="url(#c1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;302 0" dur="4.5s" begin="1.15s" repeatCount="indefinite"/>
    </rect>
    <text x="379.0" y="86" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#num)">60+</text>
    <text x="379.0" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#bff5d8">Core plugins</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.30s" dur=".6s" fill="freeze"/>
    <rect x="515" y="14" width="212" height="132" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="3.6s" begin="0.90s" repeatCount="indefinite"/>
    </rect>
    <rect x="425" y="14" width="90" height="132" fill="url(#shine)" clip-path="url(#c2)">
      <animateTransform attributeName="transform" type="translate" values="0 0;302 0" dur="4.5s" begin="1.30s" repeatCount="indefinite"/>
    </rect>
    <text x="621.0" y="86" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#num)">1,392</text>
    <text x="621.0" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#bff5d8">Marketplace plugins</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.45s" dur=".6s" fill="freeze"/>
    <rect x="757" y="14" width="212" height="132" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="3.6s" begin="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="667" y="14" width="90" height="132" fill="url(#shine)" clip-path="url(#c3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;302 0" dur="4.5s" begin="1.45s" repeatCount="indefinite"/>
    </rect>
    <text x="863.0" y="86" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#num)">AI</text>
    <text x="863.0" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#bff5d8">Claude-powered chatbot</text>
  </g>
</svg>
